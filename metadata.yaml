name: astrbot_plugin_minimax_tts
display_name: Minimax TTS 语音合成
desc: 接入 Minimax 官方 TTS API 的全功能语音合成插件，支持语音克隆、LLM 合成前润色、拦截/追加双发送模式、Fluent UI 2 设计风格控制台面板（亮/暗双主题、品牌色取色、自定义背景与圆角、canvas 实时波形可视化器）。
short_desc: Minimax 官方 TTS 全功能插件，含语音克隆、LLM 润色、Fluent UI 面板。
version: v1.2.0
author: LilycleHeart
repo: https://github.com/LilycleHeart/astrbot_plugin_minimax_tts
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
  - qq_official
  - telegram
  - discord
  - wecom
  - lark
  - dingtalk
  - kook
  - vocechat
  - weixin_official_account
  - satori
  - misskey
  - line
